name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # segunda-feira, 09:00 UTC: pega CVEs novas sem precisar de commit
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependencies:
    name: Vulnerabilidades (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Auditar
        run: npm audit --audit-level=high

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # varre o histórico inteiro, não só o último commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
